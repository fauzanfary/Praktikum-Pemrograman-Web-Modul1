<section id="tabel-harga">
  <h2>Tabel Detail Harga Pangan</h2>
  
  <!-- div pembungkus dengan tabindex="0" memungkinkan tabel digeser/di-scroll menggunakan keyboard panah jika layar kecil -->
  <div style="overflow-x: auto;" tabindex="0" aria-labelledby="tabel-caption">
    <table border="1" style="width: 100%; border-collapse: collapse; text-align: left;">
      <caption id="tabel-caption" style="caption-side: top; font-weight: bold; padding: 10px 0;">
        Daftar Harga Komoditas Berdasarkan Pasar di Tarakan
      </caption>
      
      <thead>
        <tr style="background-color: #f2f2f2;">
          <!-- scope="col" memberi tahu screen reader bahwa ini adalah header untuk kolom -->
          <th scope="col" style="padding: 8px;">Komoditas</th>
          <th scope="col" style="padding: 8px;">Lokasi Pasar</th>
          <th scope="col" style="padding: 8px;">Harga (Rp)</th>
          <th scope="col" style="padding: 8px;">Aksi</th>
        </tr>
      </thead>
      
      <tbody>
        <tr>
          <!-- scope="row" memberi tahu screen reader bahwa ini adalah header untuk baris -->
          <th scope="row" style="padding: 8px;">Beras Kualitas Bawah I</th>
          <td style="padding: 8px;">Pasar Gusher</td>
          <td style="padding: 8px;">14.000 / Kg</td>
          <td style="padding: 8px;">
            <!-- Tombol ini secara otomatis dapat difokuskan oleh tombol Tab -->
            <button type="button" aria-label="Lihat grafik harga beras di Pasar Gusher">Lihat Grafik</button>
          </td>
        </tr>
        <tr>
          <th scope="row" style="padding: 8px;">Bawang Merah</th>
          <td style="padding: 8px;">Pasar Tenguyun</td>
          <td style="padding: 8px;">35.000 / Kg</td>
          <td style="padding: 8px;">
            <button type="button" aria-label="Lihat grafik harga bawang merah di Pasar Tenguyun">Lihat Grafik</button>
          </td>
        </tr>
        <tr>
          <th scope="row" style="padding: 8px;">Cabai Rawit Merah</th>
          <td style="padding: 8px;">Pasar Boom Panjang</td>
          <td style="padding: 8px;">60.000 / Kg</td>
          <td style="padding: 8px;">
            <button type="button" aria-label="Lihat grafik harga cabai rawit di Pasar Boom Panjang">Lihat Grafik</button>
          </td>
        </tr>
      </tbody>
    </table>
  </div>
</section>
